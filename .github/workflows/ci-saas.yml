name: CI (SaaS)

on:
  push:
    branches: [main, developer]
    paths: ['saas/**']
  pull_request:
    # developer 宛の PR も検査する。main だけだと作業ブランチ→developer の
    # PR が一切チェックされず、壊れたコードが開発環境に自動反映されてしまう。
    branches: [main, developer]
    paths: ['saas/**']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: saas

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Check migrations
        run: |
          USE_SQLITE=true python manage.py makemigrations --check --dry-run

      # STORAGES は CompressedManifestStaticFilesStorage を使っており、
      # {% static %} は collectstatic が生成する manifest を必須とする。
      # これが無いとテンプレートを描画するテストが
      # 「Missing staticfiles manifest entry」で落ちる。
      # 本番の entrypoint.sh も collectstatic を実行するため、CI でも同じ状態にする。
      - name: Collect static files
        run: |
          USE_SQLITE=true python manage.py collectstatic --no-input

      - name: Run tests
        run: |
          USE_SQLITE=true python -m pytest tests/ -v
