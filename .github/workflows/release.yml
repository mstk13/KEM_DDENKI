name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create release zip
        run: |
          VERSION=${GITHUB_REF_NAME}
          zip -r "KEM_DDENKI-${VERSION}.zip" . \
            -x ".git/*" ".github/*" "*.pyc" "__pycache__/*" \
               "*/__pycache__/*" ".venv/*" "*.db" ".env"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.ref_name }}"
          body: |
            ## ダウンロード・セットアップ

            1. 下の **KEM_DDENKI-${{ github.ref_name }}.zip** をダウンロード
            2. 任意のフォルダに展開
            3. セットアップ手順は [セットアップガイド](docs/setup_guide.md) を参照

            ### 変更内容
            詳細は [コミット履歴](https://github.com/${{ github.repository }}/compare/.../${{ github.ref_name }}) を参照してください。
          files: "KEM_DDENKI-${{ github.ref_name }}.zip"
          generate_release_notes: true
