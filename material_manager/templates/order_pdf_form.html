{% extends "base.html" %}
{% block title %}発注書PDF — {{ item.name }}{% endblock %}
{% block content %}
<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/">現場一覧</a></li>
        <li class="breadcrumb-item"><a href="{{ url_for('site_detail', project_id=site.id) }}">{{ site.title }}</a></li>
        <li class="breadcrumb-item"><a href="{{ url_for('item_orders', project_id=site.id, item_id=item.id) }}">{{ item.name }}</a></li>
        <li class="breadcrumb-item active">発注書PDF</li>
    </ol>
</nav>

<h2>発注書 PDF 出力</h2>
<p class="text-muted">品目: <strong>{{ item.name }}</strong> {% if item.spec %}({{ item.spec }}){% endif %}</p>

<form method="POST" class="mt-3" style="max-width: 600px;">
    <div class="row mb-3">
        <div class="col">
            <label class="form-label">発注先（業者名）*</label>
            <input type="text" name="supplier_name" class="form-control" required>
        </div>
        <div class="col">
            <label class="form-label">発注者名 *</label>
            <input type="text" name="orderer_name" class="form-control" required>
        </div>
    </div>

    <div class="row mb-3">
        <div class="col">
            <label class="form-label">納入期限</label>
            <input type="date" name="delivery_date" class="form-control">
        </div>
        <div class="col">
            <label class="form-label">納入場所</label>
            <input type="text" name="delivery_place" class="form-control" placeholder="現場名が自動入力されます">
        </div>
    </div>

    <div class="mb-3">
        <label class="form-label">備考</label>
        <textarea name="note" class="form-control" rows="2"></textarea>
    </div>

    <button type="submit" class="btn btn-danger">PDF ダウンロード</button>
    <a href="{{ url_for('item_orders', project_id=site.id, item_id=item.id) }}" class="btn btn-secondary ms-2">戻る</a>
</form>
{% endblock %}
