{% extends "base.html" %}
{% block title %}発注登録 — {{ site.title }}{% endblock %}
{% block content %}
<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/">現場一覧</a></li>
        <li class="breadcrumb-item"><a href="{{ url_for('site_detail', project_id=site.id) }}">{{ site.title }}</a></li>
        <li class="breadcrumb-item active">発注登録</li>
    </ol>
</nav>

<h2>発注登録</h2>
<form method="POST" class="mt-3" style="max-width: 600px;">
    <div class="mb-3">
        <label class="form-label">品目 *</label>
        <select name="item_id" class="form-select" required>
            <option value="">-- 選択 --</option>
            {% for item in items %}
            <option value="{{ item.id }}">{{ item.name }} ({{ item.unit }})</option>
            {% endfor %}
        </select>
    </div>

    <div class="row mb-3">
        <div class="col">
            <label class="form-label">発注数量 *</label>
            <input type="number" name="quantity" class="form-control" step="0.1" required>
        </div>
        <div class="col">
            <label class="form-label">単価 (円) *</label>
            <input type="number" name="unit_price" class="form-control" step="1" required>
        </div>
    </div>

    <div class="row mb-3">
        <div class="col">
            <label class="form-label">発注日 *</label>
            <input type="date" name="order_date" class="form-control" value="{{ today }}" required>
        </div>
        <div class="col">
            <label class="form-label">発注者名 *</label>
            <input type="text" name="orderer" class="form-control" required>
        </div>
    </div>

    <div class="mb-3">
        <label class="form-label">発注先（業者名）</label>
        <input type="text" name="supplier" class="form-control">
    </div>

    <div class="mb-3">
        <label class="form-label">備考</label>
        <input type="text" name="note" class="form-control">
    </div>

    <button type="submit" class="btn btn-primary">発注登録</button>
    <a href="{{ url_for('site_detail', project_id=site.id) }}" class="btn btn-secondary ms-2">戻る</a>
</form>
{% endblock %}
