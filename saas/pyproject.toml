[project]
name = "kensetsu-saas"
version = "0.1.0"
description = "建設業向けマルチテナント業務SaaS"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "psycopg[binary]>=3.1",
    "django-simple-history>=3.7",
    "gunicorn>=22.0",
    "reportlab>=4.0",
    "openpyxl>=3.1",
    "Pillow>=10.0",
    "pdfplumber>=0.10",
    "pytesseract>=0.3",
    "anthropic>=0.30",
    "whitenoise>=6.5",
    "lightgbm>=4.0",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "playwright>=1.40",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "ruff>=0.5",
    "mypy>=1.10",
    "django-stubs>=5.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# これは配布用パッケージではなく Django アプリなので、setuptools には
# 何も梱包させない。指定しないと apps/config/static/templates/docker を
# 「複数のトップレベルパッケージ」と誤検出して pip install -e が失敗し、
# CI が依存インストールの時点で落ちる。
[tool.setuptools]
py-modules = []

# lint（ruff）の設定はリポジトリのルートの ruff.toml に置いている。
# saas/ の中にも設定を置くと二重になり、`ruff check .` の結果が
# 起動したディレクトリで変わる。ここには書かない（ADR-0098）。

# mypy は設定だけ置いてあり、CI では流していない。strict のまま全体に流すと
# 現状は大量に落ちるため、入れるなら段階的に範囲を絞る必要がある（ADR-0098）。
# 設定があるのに誰も流していない状態を、知らずに信用しないための注記。
[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
strict = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
# テストは saas/tests/ にしか置かない。これが無いと引数なしの `pytest` が
# apps/ 以下まで収集し、CI の `pytest tests/` と結果が変わる（ADR-0098）。
testpaths = ["tests"]
python_files = ["tests.py", "test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
