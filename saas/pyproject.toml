[project]
name = "kensetsu-saas"
version = "0.1.0"
description = "建設業向けマルチテナント業務SaaS"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "psycopg[binary]>=3.1",
    "django-simple-history>=3.7",
    "gunicorn>=22.0",
    "reportlab>=4.0",
    "openpyxl>=3.1",
    "Pillow>=10.0",
    "pdfplumber>=0.10",
    "anthropic>=0.30",
    "whitenoise>=6.5",
    "lightgbm>=4.0",
    "scikit-learn>=1.4",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "ruff>=0.5",
    "mypy>=1.10",
    "django-stubs>=5.0",
]

[tool.ruff]
target-version = "py312"
line-length = 99
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
strict = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
