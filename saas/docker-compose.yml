# ============================================================
# KEM_DDENKI 次期版 Docker Compose
# ============================================================
# 開発: docker compose up
# 本番: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# 同じPC上で本番用と開発用の2スタックを並行稼働させる前提のため、
# 公開ポートはすべて環境変数で上書きできるようにしてある。
# スタックの分離は .env の COMPOSE_PROJECT_NAME で行う
# （本番=未設定でディレクトリ名 saas、開発=kemdev）。
#
# restart は always。unless-stopped だと Docker Desktop (Windows) の終了が
# 「明示停止」と扱われ、PC再起動後に復帰しない。
# ============================================================

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: kensetsu_saas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      # リバースプロキシ（Tailscale serve 等）が TLS を終端して http へ渡す構成では、
      # HTTPS オリジンを明示的に信頼させないと POST がすべて 403 になる。
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      # 社長ポジションのログイン時に要求される管理者パスワード。
      # 既定値は settings.py と揃える（空文字を渡すと誰もログインできなくなる）。
      PRESIDENT_PIN: ${PRESIDENT_PIN:-1234}
      DB_NAME: kensetsu_saas
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: db
      DB_PORT: "5432"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-False}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-False}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@kem-ddenki.com}
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - .:/app
      - media_data:/app/media
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "4", "--threads", "2"]

  # --- 定期タスク（入札案件取得・アラート送信） ---
  cron:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production}
      DJANGO_DEBUG: "False"
      DB_NAME: kensetsu_saas
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: db
      DB_PORT: "5432"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-False}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-False}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@kem-ddenki.com}
    volumes:
      - .:/app
      - media_data:/app/media
    entrypoint: ["sh", "-c"]
    # 定時実行。cron は使わない。
    #  - python:3.12-slim に cron は入っておらず、crontab/crond が
    #    「not found」で終了コード127を返し、restart: always と相まって
    #    再起動ループになる（本番で発生。自動巡回は一度も動いていなかった）
    #  - cron を入れたとしても、cron はコンテナの環境変数をジョブに渡さない。
    #    DB_HOST 等が欠けて別の壊れ方をする
    # 分単位で時刻を見るだけのループなら、パッケージ追加も環境変数の受け渡しも要らない。
    command:
      - |
        echo "=== 定時実行サービス起動（scrape_bids 2日に1回7時 / send_document_alerts 毎日8時）==="
        cd /app
        while true; do
          now=$$(date +%H%M)
          doy=$$(date +%j)
          if [ "$$now" = "0700" ] && [ $$((10#$$doy % 2)) -eq 0 ]; then
            echo "[$$(date +%F\ %T)] scrape_bids 開始"
            python manage.py scrape_bids --force || echo "scrape_bids が失敗しました"
          fi
          if [ "$$now" = "0800" ]; then
            echo "[$$(date +%F\ %T)] send_document_alerts 開始"
            python manage.py send_document_alerts || echo "send_document_alerts が失敗しました"
          fi
          sleep 60
        done

  # --- Cloudflare Tunnel（社外アクセス用・任意） ---
  # 使用する場合は .env に CLOUDFLARE_TUNNEL_TOKEN を設定してください。
  # トークン未設定時はこのコンテナは起動しません。
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - web
    profiles:
      - tunnel

volumes:
  pgdata:
  media_data:
  static_data:
