{% extends "base.html" %}
{% block title %}名刺登録 — {{ APP_NAME }}{% endblock %}
{% block topbar_title %}取引先管理{% endblock %}
{% block content %}
<div class="page-header"><h1>名刺を登録</h1></div>
<div class="card">
  <form method="post" enctype="multipart/form-data" style="padding:24px;">
    {% csrf_token %}
    {% for field in form %}
    <div class="form-group" style="margin-bottom:16px;"><label class="form-label">{{ field.label }}</label>{{ field }}</div>
    {% endfor %}
    <div style="display:flex;gap:12px;">
      <button type="submit" class="btn btn-primary">保存</button>
      <a href="javascript:history.back()" class="btn btn-outline">キャンセル</a>
    </div>
  </form>
</div>
{% endblock %}
