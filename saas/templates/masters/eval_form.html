{% extends "base.html" %}
{% block title %}仕入先評価 — {{ APP_NAME }}{% endblock %}
{% block topbar_title %}取引先管理{% endblock %}
{% block content %}
<div class="page-header"><h1>{{ supplier.name }} の評価を追加</h1></div>
<div class="card">
  <form method="post" style="padding:24px;">
    {% csrf_token %}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
      {% for field in form %}
      <div class="form-group"><label class="form-label">{{ field.label }}</label>{{ field }}</div>
      {% endfor %}
    </div>
    <div style="margin-top:24px;display:flex;gap:12px;">
      <button type="submit" class="btn btn-primary">保存</button>
      <a href="{% url 'masters:supplier_detail' supplier.pk %}" class="btn btn-outline">キャンセル</a>
    </div>
  </form>
</div>
{% endblock %}
