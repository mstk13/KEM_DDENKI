{% extends "base.html" %}
{% block title %}{{ title }} — {{ APP_NAME }}{% endblock %}
{% block topbar_title %}{{ title }}{% endblock %}

{% block content %}
<div class="page-header"><h1>{{ title }}</h1></div>
<div class="card">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
      <div class="form-group">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {{ field.errors }}
      </div>
      {% endfor %}
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">保存</button>
        <a href="{% url 'materials:list' %}" class="btn btn-outline">キャンセル</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
