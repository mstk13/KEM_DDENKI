{% extends "base.html" %}
{% block title %}納品記録 — {{ APP_NAME }}{% endblock %}
{% block topbar_title %}材料管理{% endblock %}

{% block content %}
<div class="page-header"><h1>納品を記録: PO-{{ po.pk }}</h1></div>
<div class="card">
  <form method="post" style="padding:24px;">
    {% csrf_token %}
    {% for field in form %}
    <div class="form-group" style="margin-bottom:16px;">
      <label class="form-label">{{ field.label }}</label>
      {{ field }}
    </div>
    {% endfor %}
    <div style="display:flex;gap:12px;">
      <button type="submit" class="btn btn-primary">記録する</button>
      <a href="{% url 'materials:po_detail' po.pk %}" class="btn btn-outline">キャンセル</a>
    </div>
  </form>
</div>
{% endblock %}
