{% extends "base.html" %}
{% block title %}見積明細編集 — {{ APP_NAME }}{% endblock %}
{% block topbar_title %}材料管理{% endblock %}

{% block content %}
<div class="page-header"><h1>見積明細を編集</h1></div>
<div class="card">
  <form method="post" style="padding:24px;">
    {% csrf_token %}
    {% for field in form %}
    <div class="form-group" style="margin-bottom:16px;">
      <label class="form-label">{{ field.label }}</label>
      {{ field }}
      {% if field.help_text %}<small style="color:#888;">{{ field.help_text }}</small>{% endif %}
    </div>
    {% endfor %}
    <div style="display:flex;gap:12px;">
      <button type="submit" class="btn btn-primary">保存</button>
      <a href="{% url 'materials:quotation_detail' quotation.pk %}" class="btn btn-outline">キャンセル</a>
    </div>
  </form>
</div>
{% endblock %}
