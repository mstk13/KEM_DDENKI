{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ログイン — 建設SaaS</title>
<link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <h1>&#9653; 建設SaaS</h1>
    <p class="subtitle">業務管理システム</p>

    {% if form.errors %}
    <div class="message message-error" style="margin-bottom:16px;">
      ユーザー名またはパスワードが正しくありません。
    </div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label for="id_username">ユーザー名</label>
        <input type="text" name="username" id="id_username" class="form-control" autofocus required>
      </div>
      <div class="form-group">
        <label for="id_password">パスワード</label>
        <input type="password" name="password" id="id_password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:8px;">
        ログイン
      </button>
    </form>
  </div>
</div>
</body>
</html>
