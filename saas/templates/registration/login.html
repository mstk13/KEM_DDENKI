{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ログイン — {{ APP_NAME }}</title>
<meta name="theme-color" content="{{ APP_THEME_COLOR }}">
<link rel="icon" href="{% static 'img/favicon.ico' %}" sizes="any">
<link rel="icon" type="image/svg+xml" href="{% static 'img/icon.svg' %}">
<link rel="apple-touch-icon" href="{% static 'img/apple-touch-icon.png' %}">
<link rel="manifest" href="{% static 'manifest.webmanifest' %}">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="{{ APP_NAME }}">
<link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <img class="login-logo" src="{% static 'img/logo.png' %}" alt="{{ APP_NAME }}">
    <h1>{{ APP_NAME }}</h1>
    <p class="subtitle">{{ APP_SUBTITLE }}</p>

    {% if error %}
    <div class="message message-error" style="margin-bottom:20px;">
      {{ error }}
    </div>
    {% endif %}

    <div id="worker-info" style="display:none;background:var(--success-light);border:1px solid #c6f6d5;border-radius:8px;padding:12px 16px;margin-bottom:16px;text-align:center;">
      <span style="font-size:.92rem;font-weight:600;color:var(--success);" id="worker-name"></span>
    </div>

    <form method="post" id="login-form">
      {% csrf_token %}
      <div class="form-group">
        <label for="employee_code">社員番号</label>
        <input type="text" name="employee_code" id="employee_code" class="form-control"
               placeholder="例: E001" autofocus required
               style="font-size:1.1rem;text-align:center;letter-spacing:.1em;">
      </div>
      <div class="form-group" id="pin-group" style="display:none;">
        <label for="pin" id="pin-label">暗証番号</label>
        <input type="password" name="pin" id="pin" class="form-control"
               placeholder="4桁の暗証番号"
               maxlength="4" inputmode="numeric" pattern="[0-9]*"
               style="font-size:1.1rem;text-align:center;letter-spacing:.15em;">
      </div>
      <div id="first-login-info" style="display:none;background:#e8f4ff;border:1px solid #bee3f8;border-radius:8px;padding:12px 16px;margin-bottom:8px;text-align:center;">
        <small style="color:#2b6cb0;">初回ログインです。ログイン後に4桁の暗証番号を設定してください。</small>
      </div>
      <button type="submit" id="login-btn" class="btn btn-primary" style="width:100%;justify-content:center;padding:12px;margin-top:8px;font-size:.92rem;">
        ログイン
      </button>
    </form>
  </div>
</div>

<script>
const codeInput = document.getElementById('employee_code');
const pinGroup = document.getElementById('pin-group');
const pinInput = document.getElementById('pin');
const workerInfo = document.getElementById('worker-info');
const workerName = document.getElementById('worker-name');
const loginBtn = document.getElementById('login-btn');

let checkTimer = null;

codeInput.addEventListener('input', function() {
  clearTimeout(checkTimer);
  const code = this.value.trim();

  if (code.length < 2) {
    workerInfo.style.display = 'none';
    pinGroup.style.display = 'none';
    return;
  }

  checkTimer = setTimeout(function() {
    fetch('{% url "check_employee_code" %}?code=' + encodeURIComponent(code))
      .then(r => r.json())
      .then(data => {
        const firstLoginInfo = document.getElementById('first-login-info');
        const pinLabel = document.getElementById('pin-label');
        if (data.found) {
          workerName.textContent = data.name;
          workerInfo.style.display = 'block';
          if (data.needs_pin) {
            pinGroup.style.display = 'block';
            pinInput.required = true;
            firstLoginInfo.style.display = 'none';
            // 社長の場合はラベルを変更
            pinLabel.textContent = data.is_first_login ? '暗証番号' : '暗証番号';
          } else if (data.is_first_login) {
            pinGroup.style.display = 'none';
            pinInput.required = false;
            pinInput.value = '';
            firstLoginInfo.style.display = 'block';
          } else {
            pinGroup.style.display = 'none';
            pinInput.required = false;
            pinInput.value = '';
            firstLoginInfo.style.display = 'none';
          }
        } else {
          workerInfo.style.display = 'none';
          pinGroup.style.display = 'none';
          firstLoginInfo.style.display = 'none';
        }
      })
      .catch(() => {});
  }, 300);
});
</script>
</body>
</html>
