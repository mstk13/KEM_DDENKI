{% extends "base.html" %}
{% block title %}健康診断削除 — {{ worker.name }}{% endblock %}
{% block topbar_title %}健康診断削除{% endblock %}

{% block content %}
<div class="card" style="max-width:480px;">
  <div class="card-body">
    <p>{{ checkup.checkup_date }} の健康診断記録を削除しますか？</p>
    <form method="post">
      {% csrf_token %}
      <div class="form-actions">
        <button type="submit" class="btn btn-danger">削除する</button>
        <a href="{% url 'workers:detail' worker.pk %}" class="btn btn-outline">キャンセル</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
