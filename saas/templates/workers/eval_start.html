{% extends "base.html" %}
{% block title %}評価を作成 — 建設SaaS{% endblock %}
{% block topbar_title %}人材評価{% endblock %}

{% block content %}
<div class="page-header">
  <h1>評価アンケートを作成</h1>
</div>

<div style="max-width:560px;">
  <div class="card">
    <div class="card-header"><h2>対象者と期間を選択</h2></div>
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        <div class="form-group">
          <label for="worker">評価対象者</label>
          <select name="worker_id" id="worker" class="form-control" required>
            <option value="">作業員を選択してください</option>
            {% for w in workers %}
            <option value="{{ w.pk }}">{{ w.name }}（{{ w.job_title|default:"未設定" }}）</option>
            {% endfor %}
          </select>
          <p style="font-size:.78rem;color:var(--text-muted);margin-top:6px;">
            職種に応じた評価項目が自動的に表示されます
          </p>
        </div>
        <div class="form-group">
          <label for="period">評価期間</label>
          <input type="text" name="period" id="period" class="form-control" placeholder="例: 2026年上期、2026-Q2" required>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">アンケートを開始</button>
          <a href="{% url 'workers:evaluations' %}" class="btn btn-outline">キャンセル</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
