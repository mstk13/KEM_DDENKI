{% extends "base.html" %}
{% block title %}評価対象を選択 — 建設SaaS{% endblock %}
{% block topbar_title %}人材評価 — 対象者を選択{% endblock %}

{% block content %}
<div class="page-header">
  <h1>評価アンケートを開始</h1>
</div>

<div class="card">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="form-row">
        <div class="form-group">
          <label for="worker">評価対象者</label>
          <select name="worker_id" id="worker" class="form-control" required>
            <option value="">選択してください</option>
            {% for w in workers %}
            <option value="{{ w.pk }}">{{ w.name }}（{{ w.job_title|default:"未設定" }}）</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label for="period">評価期間</label>
          <input type="text" name="period" id="period" class="form-control" placeholder="例: 2026年上期" required>
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">アンケートを開始</button>
        <a href="{% url 'workers:evaluations' %}" class="btn btn-outline">戻る</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
