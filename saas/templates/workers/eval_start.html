{% extends "base.html" %}
{% block title %}評価を作成 — 建設SaaS{% endblock %}
{% block topbar_title %}人材評価{% endblock %}

{% block content %}
<div class="page-header">
  <h1>評価アンケートを作成</h1>
</div>

<div style="max-width:600px;">
  <div class="card">
    <div class="card-header"><h2>評価者と期間を選択</h2></div>
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        <div class="form-group">
          <label for="evaluator">評価者（あなた）</label>
          <select name="evaluator_id" id="evaluator" class="form-control" required>
            <option value="">評価者を選択してください</option>
            {% for w in workers %}
            <option value="{{ w.pk }}" {% if w.user == request.user %}selected{% endif %}>
              {{ w.name }}（{{ w.job_title|default:"未設定" }}）
            </option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label for="period">評価期間</label>
          <input type="text" name="period" id="period" class="form-control" placeholder="例: 2026年上期、2026-Q2" required>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">被評価者を選択する</button>
          <a href="{% url 'workers:evaluations' %}" class="btn btn-outline">キャンセル</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
