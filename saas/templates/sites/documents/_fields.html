{% for field in form %}
<div class="form-group">
  {% if field.widget_type == "checkbox" %}
  <label style="display:flex;gap:8px;align-items:center;">{{ field }} {{ field.label }}</label>
  {% else %}
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% endif %}
  {% if field.help_text %}<small style="color:var(--text-secondary);">{{ field.help_text }}</small>{% endif %}
  {{ field.errors }}
</div>
{% endfor %}
