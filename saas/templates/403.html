{% extends "base.html" %}

{% block content %}
<div class="card">
  <div class="card-body">
    <div class="empty">
      <div class="empty-icon">&#x1f512;</div>
      <h1 style="margin:8px 0 4px;">アクセス権限がありません</h1>
      <p>{% firstof exception "この画面を表示する権限がありません。" %}</p>

      <p style="margin-top:20px;">
        <a href="{% url 'dashboard' %}" class="btn btn-primary">ダッシュボードに戻る</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
