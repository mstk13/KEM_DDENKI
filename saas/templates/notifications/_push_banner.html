{# まだスマホへの通知を受け取っていない人への案内（ADR-0062）。出すかどうかは push.js が決める #}
<div class="push-banner" data-push-panel data-push-banner hidden>
  <div class="push-banner-text">
    <div data-push-when="off" hidden>
      <strong>📱 スマホに通知を受け取りませんか？</strong>
      <p>朝の KY の知らせなどが、アプリを開いていなくても届きます。あとで通知の画面（🔔）からでもオンにできます。</p>
      <button type="button" class="btn btn-primary btn-sm" data-push-action="subscribe">この端末で受け取る</button>
    </div>
    <div data-push-when="ios-home" hidden>
      <strong>📱 iPhone でも通知を受け取れます</strong>
      <p>Safari の共有ボタンから「ホーム画面に追加」をして、ホーム画面のアプリから開いてください（iOS 16.4 以降）。</p>
    </div>
  </div>
  <button type="button" class="push-banner-close" data-push-action="dismiss" aria-label="この案内を閉じる">×</button>
</div>
<p class="push-message" data-push-message role="status" hidden></p>
