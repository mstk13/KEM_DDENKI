x-common-env: &common-env
  KEM_DATA_DIR: /data
  DATABASE_URL: postgresql://kem:kem@postgres:5432/kem_ddenki

x-app-base: &app-base
  build:
    context: .
    dockerfile: docker/Dockerfile.app
  volumes:
    - kem_data:/data
  env_file:
    - .env
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy

services:
  # --- データベース ---
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kem
      POSTGRES_PASSWORD: kem
      POSTGRES_DB: kem_ddenki
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./shared/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kem -d kem_ddenki"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- リバースプロキシ ---
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/portal:/usr/share/nginx/html:ro
    restart: unless-stopped

  # --- コアアプリ (4つ) ---
  bid_manager:
    <<: *app-base
    environment:
      <<: *common-env
    command:
      - bid_manager
      - streamlit
      - run
      - app.py
      - --server.port=8501
      - --server.headless=true
      - --server.address=0.0.0.0
      - --server.baseUrlPath=/bid

  material_manager:
    <<: *app-base
    environment:
      <<: *common-env
    command:
      - material_manager
      - python
      - app.py

  sagyo_nippou:
    <<: *app-base
    environment:
      <<: *common-env
    command:
      - sagyo-nippou
      - streamlit
      - run
      - app.py
      - --server.port=8502
      - --server.headless=true
      - --server.address=0.0.0.0
      - --server.baseUrlPath=/nippou

  evaluation:
    <<: *app-base
    environment:
      <<: *common-env
    command:
      - evaluation
      - streamlit
      - run
      - app.py
      - --server.port=8504
      - --server.headless=true
      - --server.address=0.0.0.0
      - --server.baseUrlPath=/eval

  evaluation_admin:
    <<: *app-base
    environment:
      <<: *common-env
    command:
      - evaluation
      - streamlit
      - run
      - admin_app.py
      - --server.port=8505
      - --server.headless=true
      - --server.address=0.0.0.0
      - --server.baseUrlPath=/eval-admin

  # --- オプションアプリ (docker compose --profile optional up -d) ---
  eigyo_kanri:
    <<: *app-base
    profiles: [optional]
    environment:
      <<: *common-env
    command:
      - eigyo-kanri
      - streamlit
      - run
      - app.py
      - --server.port=8504
      - --server.headless=true
      - --server.address=0.0.0.0
      - --server.baseUrlPath=/eigyo

  nippou_kanri:
    <<: *app-base
    profiles: [optional]
    environment:
      <<: *common-env
    command:
      - nippou-kanri
      - streamlit
      - run
      - app.py
      - --server.port=8510
      - --server.headless=true
      - --server.address=0.0.0.0
      - --server.baseUrlPath=/nippou-kanri

volumes:
  kem_data:
  pg_data:
