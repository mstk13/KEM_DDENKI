<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ケンモチ電機</title>
    <link rel="icon" href="icon-192.png" type="image/png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Yu Gothic UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .logo {
            width: 100px; height: 100px;
            margin-bottom: 12px; border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        h1 { color: #fff; font-size: 1.6rem; margin-bottom: 8px; }
        .subtitle { color: #8892b0; font-size: 0.85rem; margin-bottom: 36px; }
        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px; max-width: 960px; width: 100%;
        }
        .app-card {
            background: rgba(255,255,255,0.07);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px; padding: 28px 24px;
            text-align: center; cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none; display: block;
        }
        .app-card:hover {
            transform: translateY(-6px);
            background: rgba(255,255,255,0.13);
            border-color: rgba(255,255,255,0.25);
            box-shadow: 0 12px 40px rgba(0,0,0,0.3);
        }
        .app-icon { font-size: 2.8rem; margin-bottom: 14px; display: block; }
        .app-name { color: #fff; font-size: 1.1rem; font-weight: 600; margin-bottom: 8px; }
        .app-desc { color: #8892b0; font-size: 0.8rem; line-height: 1.5; }
        .app-card[data-color="blue"]   { border-top: 3px solid #4a90d9; }
        .app-card[data-color="green"]  { border-top: 3px solid #50c878; }
        .app-card[data-color="cyan"]   { border-top: 3px solid #17a2b8; }
        .app-card[data-color="orange"] { border-top: 3px solid #ffc107; }
        footer { color: #4a5568; font-size: 0.75rem; margin-top: 40px; }

        /* Setup dialog */
        .setup-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: flex;
            align-items: center; justify-content: center; z-index: 100;
        }
        .setup-box {
            background: #1e2a3a; border-radius: 16px; padding: 36px;
            max-width: 420px; width: 90%; text-align: center;
            border: 1px solid rgba(255,255,255,0.15);
        }
        .setup-box h2 { color: #fff; margin-bottom: 16px; font-size: 1.2rem; }
        .setup-box p { color: #8892b0; font-size: 0.9rem; margin-bottom: 20px; }
        .setup-box input {
            width: 100%; padding: 12px 16px; border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1);
            color: #fff; font-size: 1.1rem; text-align: center;
            margin-bottom: 16px; outline: none;
        }
        .setup-box input:focus { border-color: #4a90d9; }
        .setup-box button {
            padding: 12px 32px; border: none; border-radius: 8px;
            background: #4a90d9; color: #fff; font-size: 1rem;
            cursor: pointer; transition: background 0.2s;
        }
        .setup-box button:hover { background: #3a7bc8; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <!-- Setup dialog (shown if no server IP configured) -->
    <div class="setup-overlay hidden" id="setupDialog">
        <div class="setup-box">
            <img src="icon-192.png" alt="KEC" style="width:64px;height:64px;border-radius:12px;margin-bottom:16px;">
            <h2>初回設定</h2>
            <p>サーバーPCのIPアドレスを入力してください<br><small style="color:#666;">（例: 192.168.0.27）</small></p>
            <input type="text" id="serverIpInput" placeholder="192.168.0.27" autofocus>
            <br>
            <button onclick="saveServerIp()">設定する</button>
        </div>
    </div>

    <img src="icon-512.png" alt="KEC" class="logo">
    <h1>ケンモチ電機</h1>
    <p class="subtitle">施工コスト最適化システム</p>

    <div class="apps-grid">
        <a class="app-card" data-color="blue" data-port="8501">
            <span class="app-icon">📋</span>
            <div class="app-name">入札案件管理</div>
            <div class="app-desc">案件の収集・進捗管理<br>費用分析・競合分析</div>
        </a>
        <a class="app-card" data-color="green" data-port="5000">
            <span class="app-icon">🔧</span>
            <div class="app-name">材料管理</div>
            <div class="app-desc">見積もり vs 発注比較<br>消化率の可視化</div>
        </a>
        <a class="app-card" data-color="cyan" data-port="8502">
            <span class="app-icon">🛠️</span>
            <div class="app-name">作業日報</div>
            <div class="app-desc">作業記録・勤怠管理<br>月次集計・稼働分析</div>
        </a>
        <a class="app-card" data-color="orange" data-port="8503">
            <span class="app-icon">📊</span>
            <div class="app-name">人事評価</div>
            <div class="app-desc">役割別評価基準<br>評価ランク自動判定</div>
        </a>
    </div>

    <p style="margin-top:24px;">
        <a href="#" onclick="showSetup(); return false;" style="color:#4a5568; font-size:0.75rem; text-decoration:underline;">サーバーIP設定を変更</a>
    </p>

    <footer>&copy; 2026 ケンモチ電機</footer>

    <script src="config.js" onerror=""></script>
    <script>
        // config.js sets KEC_SERVER_IP, localStorage is fallback
        var SERVER_IP = (typeof KEC_SERVER_IP !== 'undefined' ? KEC_SERVER_IP : '') || localStorage.getItem('kec_server_ip') || '';

        function showSetup() {
            document.getElementById('setupDialog').classList.remove('hidden');
            document.getElementById('serverIpInput').value = SERVER_IP;
            document.getElementById('serverIpInput').focus();
        }

        function saveServerIp() {
            var ip = document.getElementById('serverIpInput').value.trim();
            if (!ip) { alert('IPアドレスを入力してください'); return; }
            localStorage.setItem('kec_server_ip', ip);
            SERVER_IP = ip;
            document.getElementById('setupDialog').classList.add('hidden');
            updateLinks();
        }

        function updateLinks() {
            document.querySelectorAll('.app-card[data-port]').forEach(function(card) {
                var port = card.getAttribute('data-port');
                card.href = 'http://' + SERVER_IP + ':' + port;
                card.target = '_blank';
            });
        }

        // On load
        if (!SERVER_IP) {
            showSetup();
        } else {
            updateLinks();
        }

        // Allow Enter key in input
        document.getElementById('serverIpInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') saveServerIp();
        });
    </script>
</body>
</html>
