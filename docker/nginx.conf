events {
    worker_connections 256;
}

http {
    include       /etc/nginx/mime.types;
    sendfile      on;

    # Streamlit WebSocket 用タイムアウト
    proxy_read_timeout  86400;
    proxy_send_timeout  86400;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream bid       { server bid_manager:8501; }
    upstream material  { server material_manager:5000; }
    upstream nippou    { server sagyo_nippou:8502; }
    upstream eval      { server evaluation:8504; }
    upstream evaladm   { server evaluation_admin:8505; }
    upstream kouki     { server kouki_kanri:8506; }
    upstream jinzai    { server jinzai_kanri:8507; }
    upstream devkanri  { server dev_kanri:8508; }

    server {
        listen 80;

        # ポータル（静的HTML）
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # --- 入札案件管理 (Streamlit) ---
        location /bid/ {
            proxy_pass http://bid/bid/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
        }
        location /bid/_stcore/ {
            proxy_pass http://bid/bid/_stcore/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # --- 材料管理 (Flask) ---
        location /material/ {
            proxy_pass http://material/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-Prefix /material;
        }

        # --- 作業日報 (Streamlit) ---
        location /nippou/ {
            proxy_pass http://nippou/nippou/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
        }
        location /nippou/_stcore/ {
            proxy_pass http://nippou/nippou/_stcore/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # --- 人事評価 (Streamlit) ---
        location /eval/ {
            proxy_pass http://eval/eval/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
        }
        location /eval/_stcore/ {
            proxy_pass http://eval/eval/_stcore/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # --- 人事評価 管理 (Streamlit) ---
        location /eval-admin/ {
            proxy_pass http://evaladm/eval-admin/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
        }
        location /eval-admin/_stcore/ {
            proxy_pass http://evaladm/eval-admin/_stcore/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # --- 工期管理 (Streamlit) ---
        location /kouki/ {
            proxy_pass http://kouki/kouki/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
        }
        location /kouki/_stcore/ {
            proxy_pass http://kouki/kouki/_stcore/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # --- 人材管理 (Streamlit) ---
        location /jinzai/ {
            proxy_pass http://jinzai/jinzai/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
        }
        location /jinzai/_stcore/ {
            proxy_pass http://jinzai/jinzai/_stcore/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # --- 開発管理 (Streamlit) ---
        location /dev/ {
            proxy_pass http://devkanri/dev/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
        }
        location /dev/_stcore/ {
            proxy_pass http://devkanri/dev/_stcore/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
