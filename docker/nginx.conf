events {
    worker_connections 256;
}

http {
    include       /etc/nginx/mime.types;
    sendfile      on;

    # Streamlit WebSocket 用タイムアウト
    proxy_read_timeout  86400;
    proxy_send_timeout  86400;

    # Docker内蔵DNS — コンテナ再作成時のIP変更に追従する
    resolver 127.0.0.11 valid=5s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;

        # ポータル（静的HTML）
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # --- 入札案件管理 (Streamlit) ---
        location /bid/ {
            set $upstream_bid bid_manager:8501;
            proxy_pass http://$upstream_bid/bid/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
        }
        location /bid/_stcore/ {
            set $upstream_bid bid_manager:8501;
            proxy_pass http://$upstream_bid/bid/_stcore/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # --- 材料管理 (Flask) ---
        location /material/ {
            set $upstream_material material_manager:5000;
            proxy_pass http://$upstream_material/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-Prefix /material;
        }

        # --- 作業日報 (Streamlit) ---
        location /nippou/ {
            set $upstream_nippou sagyo_nippou:8502;
            proxy_pass http://$upstream_nippou/nippou/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
        }
        location /nippou/_stcore/ {
            set $upstream_nippou sagyo_nippou:8502;
            proxy_pass http://$upstream_nippou/nippou/_stcore/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # --- 人事評価 (Streamlit) ---
        location /eval/ {
            set $upstream_eval evaluation:8504;
            proxy_pass http://$upstream_eval/eval/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
        }
        location /eval/_stcore/ {
            set $upstream_eval evaluation:8504;
            proxy_pass http://$upstream_eval/eval/_stcore/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # --- 人事評価 管理 (Streamlit) ---
        location /eval-admin/ {
            set $upstream_evaladm evaluation_admin:8505;
            proxy_pass http://$upstream_evaladm/eval-admin/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
        }
        location /eval-admin/_stcore/ {
            set $upstream_evaladm evaluation_admin:8505;
            proxy_pass http://$upstream_evaladm/eval-admin/_stcore/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # --- 工期管理 (Streamlit) ---
        location /kouki/ {
            set $upstream_kouki kouki_kanri:8506;
            proxy_pass http://$upstream_kouki/kouki/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
        }
        location /kouki/_stcore/ {
            set $upstream_kouki kouki_kanri:8506;
            proxy_pass http://$upstream_kouki/kouki/_stcore/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # --- 人材管理 (Streamlit) ---
        location /jinzai/ {
            set $upstream_jinzai jinzai_kanri:8507;
            proxy_pass http://$upstream_jinzai/jinzai/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
        }
        location /jinzai/_stcore/ {
            set $upstream_jinzai jinzai_kanri:8507;
            proxy_pass http://$upstream_jinzai/jinzai/_stcore/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

    }
}
